; PHP-FPM pool: runs as the account user.
[www]
user = commonsight
group = commonsight
listen = 9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Must carry the fallback in the status endpoint (Architecture 6.3).
request_terminate_timeout = 180
catch_workers_output = yes
