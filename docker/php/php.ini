; PHP settings as intended for operation.

memory_limit = 256M
max_execution_time = 120
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Deliberately not UTC: code that relies on the default time zone instead of UTC stands out.
date.timezone = Europe/Berlin

; Strict like a hosting account: only the own home and /tmp.
open_basedir = /home/commonsight:/tmp

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
