# Virtual host: the webroot of the account is the root of the (sub)domain.

ServerName localhost
DocumentRoot "/home/commonsight/public_html"

<Directory "/home/commonsight/public_html">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.html index.php

<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>

# Like many hosters: compression for common types, also application/octet-stream, so that the .htaccess
# must reliably switch it off for .pmtiles (A-05).
AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript \
    application/javascript application/json application/octet-stream
AddType application/octet-stream .pmtiles

ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 common
